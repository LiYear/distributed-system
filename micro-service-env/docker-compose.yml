services:
  # MySQL 8.0 分库数据库
  mysql:
    image: mysql:8.0
    container_name: ms-mysql
    # 安全修复(SEC-06)：不直接暴露默认端口到宿主机
    # 容器间通过 ms-network 内部网络用 :3306 访问即可
    # 如需本地调试可改为 "13306:3306"
    ports:
       - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      # 自动创建各服务独立数据库
      MYSQL_DATABASE: db_user,db_goods,db_order
    volumes:
      - ./mysql-data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # Redis 分布式缓存
  redis:
    image: redis:alpine
    container_name: ms-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # RabbitMQ 消息队列（带管理后台）
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ms-rabbitmq
    ports:
      - "5672:5672"   # 消息端口
      - "15672:15672" # 管理后台端口
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-admin123}
    restart: unless-stopped

  # Nacos 服务注册&配置中心（单机版）
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: ms-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone  # 单机模式（学习用）
    restart: unless-stopped

# 统一命名网络，与应用层 docker-compose 通过 external: true 共享
networks:
  default:
    name: ms-network
